<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App | Add Task</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/add.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Todo App</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="details-form">
            <div id="primary-details" class="details-box">
                <h2>Primary Details</h2>
                <label for="todo-name">Name </label>
                <input type="text" name="todo-name" id="todo-name" placeholder="Enter Task Name" required>
    
                <label for="todo-desc">Description </label>
                <textarea name="todo-desc" id="todo-description"
                    placeholder="(Optional) Enter Additional Details"></textarea>
    
                <label for="start-date">Start Date</label>
                <input type="date" name="start-date" id="start-date" required>
    
                <label for="due-date">Due Date</label>
                <input type="date" name="due-date" id="due-date" required>
            </div>

            <div id="secondary-details" class="details-box">
                <h2>Secondary Details</h2>
                <label for="email">Email</label>
                <input type="email" name="email" id="">

                <label for="box-color">Choose Box Color for this Task</label>
                <input type="color" name="box-color" id="box-color">
    
    
                <label for="cover-image">Choose cover Image</label>
                <input type="image" src="" alt="" name="cover-image">
    
                <label for="task-progress">Task Progress</label>
                <input type="range" name="task-progress" id="task-progress">
            </div>

            <div id="additional-details" class="details-box">
                <h2>Additional Details</h2>
                <label for="mobile-number">Mobile Number</label>
                <input type="tel" name="mobile-number" id="mobile-number">
    
                <label for="related-link">Enter related link (if any)</label>
                <input type="url" name="related-link" id="related-link">
    
                <div id="task-notification">
                    <label for="task-notification">Notification Method</label>
                    <input type="checkbox" name="email-notification" id="">
                    <label for="email-notification">Email</label>
                    <input type="checkbox" name="sms-notfication" id="">
                    <label for="email-notification">SMS</label>
                </div>
    
                <div id="priority-selection">
                    <label for="task-notification">Set priority</label>
                    <input type="radio" name="high-priority" id="">
                    <label for="high-priority">High</label>
    
                    <input type="radio" name="medium-priority" id="">
                    <label for="medium-priority">Medium</label>
    
                    <input type="radio" name="low-priority" id="">
                    <label for="low-priority">Low</label>
                </div>
            </div>

            <button type="submit" id="submit">Add Task</button>


        </form>
    </main>

    <div class="success-card none">
        <img src="img/check.png" alt="">
        <p>Successfully Added</p>
    </div>
    <div class="error-card none">
        <img src="img/cross.png" alt="">
        <p>Error</p>
    </div>
</body>
<script src="js/add.js"></script>

</html>
