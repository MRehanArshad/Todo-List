<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App | Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="dashboard.html">Todo App</a></li>
            </ul>
        </nav>
        <div class="search">
            <input type="search" id="search-bar" placeholder="Enter something to search....">
        </div>
        <div class="logout">
            <button id="logout-btn" class="logout-btn">📤 Logout</button>
        </div>
    </header>
    <main class="hero-section">
        <div class="sidebar-section">
            <h2>Navigation</h2>
            <ul class="sidebar-tabs">
                <li class="sidebar-item active">
                    <a href="dashboard.html">Analytics Page</a>
                </li>
                <li class="sidebar-item">
                    <a href="dashboard-details.html">Data Page</a>
                </li>
            </ul>
        </div>
        <div class="analytics-section">
            <h1>Admin Dashboard</h1>
            <div class="cards-section">
                <div class="info-card">
                    <h2>Total Tasks</h2>
                    <hr>
                    <h2 id="tasks-count" class="info-num"></h2>
                </div>

                <div class="info-card">
                    <h2>Total Users</h2>
                    <hr>
                    <h2 id="users-count" class="info-num"></h2>
                </div>
            </div>
            <div class="graph-section">
                <h2>Users and Tasks Analytics</h2>
                <div style="width: 500px; margin: auto; padding: 20px; background-color: #f5f5f5; border-radius: 10px;">
                    <canvas id="myGraph"></canvas>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="js/dashboard.js"></script>

</html>
