<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App | Login Page</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main>
        <form>
            <h1>Sign Up</h1>
            <input type="text" name="firstname" id="firstname" class="text-input" placeholder="First Name" required>
            
            <input type="text" name="lastname" id="lastname" class="text-input" placeholder="Last Name">

            <input type="text" name="username" id="username" class="text-input" placeholder="Username" required>

            <input type="password" name="password" id="password" class="text-input" placeholder="Password" required>

            <input type="button" value="Sign Up" class="submit-btn" id="submit">

            <p>Already Have an account? <a href="login.html">Login instead</a></p>
        </form>
    </main>
</body>
<script src="js/signup.js"></script>
</html>
