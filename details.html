<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App | Task Details</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/details.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Todo App</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="todo-details">
            <div class="title">
                <h1 id="title"></h1>
            </div>
            <div class="description">
                <h3>Details</h3>
                <p id="description"></p>
            </div>
            <div class="time-details">
                <div class="time">
                    <h4>Start date</h4>
                    <p id="start-date"></p>
                </div>
                <div class="time">
                    <h4>End date</h4>
                    <p id="end-date"></p>
                </div>
            </div>
        </div>
    </main>

</body>
<script src="js/details.js"></script>

</html>
