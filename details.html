<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App | Task Details</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/details.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Todo App</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="details">
            <div class="section-details">
                <h1>Primary Details</h1>
                <div class="title">
                    <h2 id="title"></h2>
                </div>
                <div class="description">
                    <h3>Description</h3>
                    <p id="description"></p>
                </div>
                <div class="time-details">
                    <div class="time">
                        <h4>Start date</h4>
                        <p id="start-date"></p>
                    </div>
                    <div class="time">
                        <h4>End date</h4>
                        <p id="end-date"></p>
                    </div>
                </div>
            </div>
            <hr>
            <div class="section-details">
                <h1>Secondary Details</h1>
                <div class="element">
                    <h4>Email</h4>
                    <p id="email"></p>
                </div>
                <div class="element">
                    <h4>Mobile Number</h4>
                    <p id="mobile-number"></p>
                </div>
                <div class="element">
                    <h4>Related Link</h4>
                    <p id="related-link"></p>
                </div>
                <div class="element">
                    <h4>Task Progress</h4>
                    <p id="task-progress"></p>
                </div>
            </div>
            <hr>
            <div class="section-details">
                <h1>Additional Details</h1>
                <div class="element">
                    <h4>Priority</h4>
                    <p id="priority"></p>
                </div>
                <div class="element">
                    <h4>Notification Method (or Methods)</h4>
                    <p id="notification-method"></p>
                </div>
            </div>
        </div>
    </main>

</body>
<script src="js/details.js"></script>

</html>
